services:
  complit_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/complit_db
    ports:
      - '3001:3001'
    networks:
      - app-network
  complit_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_URL: http://complit_api:3001
      API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    networks:
      - app-network

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: complit_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - app-network

  complit_ai_api:
    build:
      context: ./ai_api
      dockerfile: Dockerfile
    environment:
      PORT: 3002
      OLLAMA_HOST: http://ollama:11434
    ports:
      - '3002:3002'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
